name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      JAVA_HOME: /usr/lib/jvm/default-java
      ANDROID_HOME: /usr/lib/android-sdk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          VERSION="4.3.stable"
          mkdir -p ~/.local/share/godot/export_templates/$VERSION
          if [ -d /root/.local/share/godot/export_templates/$VERSION ]; then
            cp -r /root/.local/share/godot/export_templates/$VERSION/* ~/.local/share/godot/export_templates/$VERSION/
          elif [ -d /root/.local/share/godot/export_templates/ ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/$VERSION/
          fi

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Initialize Project Import Cache
        run: |
          godot --headless --editor --quit || true

      - name: Build Debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/game.apk
          
